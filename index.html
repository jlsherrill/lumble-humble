<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numble Jumble</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button"
          aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>

  <header class="app-header">
    <h1 class="logo" id="homeLink">Numble&nbsp;Jumble</h1>
    <p class="tagline">Learn your words, beat the clock.</p>
  </header>

  <main id="app">
    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <div class="card">
        <h2>Choose a difficulty</h2>
        <div class="segmented" id="difficulty" role="group" aria-label="Difficulty">
          <button type="button" data-diff="easy">😊 Easy</button>
          <button type="button" data-diff="medium" class="selected">🙂 Medium</button>
          <button type="button" data-diff="hard">😤 Hard</button>
        </div>
        <p class="diff-desc" id="diffDesc"></p>

        <h2 class="mode-heading">Choose a mode</h2>
        <button class="btn btn-primary btn-block" id="btnRandom">
          🎲 Random Quiz <span class="sub">20 words from every category</span>
        </button>

        <div class="category-block">
          <label for="categorySelect">Practice by Category</label>
          <select id="categorySelect"></select>
          <button class="btn btn-secondary btn-block" id="btnCategory">
            📚 Start Category Practice
          </button>
        </div>

        <button class="btn btn-ghost btn-block" id="btnProgress">
          📈 View Progress
        </button>
      </div>
    </section>

    <!-- QUIZ -->
    <section id="screen-quiz" class="screen">
      <div class="card">
        <div class="quiz-top">
          <span class="progress-label" id="progressLabel">Question 1 of 20</span>
          <div class="timer" id="timer">
            <svg viewBox="0 0 48 48" class="timer-ring">
              <circle class="timer-track" cx="24" cy="24" r="20"></circle>
              <circle class="timer-progress" id="timerProgress" cx="24" cy="24" r="20"></circle>
            </svg>
            <span class="timer-text" id="timerText">30</span>
          </div>
        </div>

        <div id="wordBankSection">
          <p class="prompt-label" id="wordBankLabel">Word Bank</p>
          <ul class="word-bank" id="wordBank"></ul>
        </div>

        <p class="prompt-label">Definition</p>
        <p class="definition" id="definition"></p>

        <form id="answerForm" autocomplete="off">
          <input type="text" id="answerInput" placeholder="Type the word…"
                 autocomplete="off" autocapitalize="off" spellcheck="false">
          <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
        </form>

        <p class="feedback" id="feedback"></p>
      </div>
    </section>

    <!-- RESULTS -->
    <section id="screen-results" class="screen">
      <div class="card">
        <h2>Your Score</h2>
        <p class="score" id="scoreText">0 / 20</p>
        <p class="score-sub" id="scoreSub"></p>

        <div class="review" id="review"></div>

        <div class="actions">
          <button class="btn btn-primary" id="btnRetry">Try Again</button>
          <button class="btn btn-secondary" id="btnResultsProgress">View Progress</button>
          <button class="btn btn-ghost" id="btnResultsHome">Home</button>
        </div>
      </div>
    </section>

    <!-- PROGRESS -->
    <section id="screen-progress" class="screen">
      <div class="card">
        <h2>Progress Over Time</h2>
        <div id="graphWrap" class="graph-wrap"></div>
        <p class="graph-empty" id="graphEmpty" hidden>
          No attempts yet — finish a quiz to start tracking your progress!
        </p>
        <div class="actions">
          <button class="btn btn-ghost" id="btnProgressHome">Home</button>
          <button class="btn btn-danger" id="btnClearHistory">Clear History</button>
        </div>
      </div>
    </section>
  </main>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
